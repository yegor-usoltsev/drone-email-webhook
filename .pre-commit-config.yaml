repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        # Generated by email-template/build.tsx, which writes no final newline.
        exclude: ^email\.html$
      - id: mixed-line-ending
        args: [--fix=lf]
        # email.html is generated without a final newline; the macOS Icon pattern in
        # .gitignore files ends with two carriage returns.
        exclude: ^email\.html$|(^|/)(\.|dot_)gitignore(\.tmpl)?$
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md,mdx"]
        # email.html is generated; the macOS Icon pattern in .gitignore files ends
        # with two carriage returns.
        exclude: ^email\.html$|(^|/)(\.|dot_)gitignore(\.tmpl)?$
  - repo: https://github.com/yegor-usoltsev/pre-commit-hooks
    rev: v1.0.2
    hooks:
      - id: gitleaks
      - id: shellcheck
      - id: shfmt
      - id: hadolint
      - id: actionlint
      - id: zizmor
      - id: check-renovate
      - id: golangci-lint
  - repo: local
    hooks:
      - id: email-template-build
        name: build email.html
        entry: bun run --cwd email-template build
        language: system
        files: ^email-template/
        pass_filenames: false
      - id: email-template-lint
        name: lint email-template
        entry: bun run --cwd email-template lint
        language: system
        files: ^email-template/
        pass_filenames: false
